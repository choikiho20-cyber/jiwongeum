name: 매일 수집·발송·배포

on:
  # UTC 21:00 = 한국시간 06:00
  schedule:
    - cron: "0 21 * * *"
  # 필요할 때 Actions 탭에서 직접 돌릴 수 있게 해 둔다
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 로컬은 .env를 쓰지만 CI에서는 저장소 Secrets에서 받는다
      - name: 공고 수집
        run: node scripts/collect.mjs
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}

      - name: 아침 브리핑 발송
        run: node scripts/notify.mjs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

      # 다음 실행 때 "어제 없던 것"을 가리려면 수집 결과가 저장소에 남아야 한다
      - name: 수집 결과 저장
        run: |
          git config user.name "jiwongeum-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/notices.json
          git diff --staged --quiet || git commit -m "수집 $(date +%Y-%m-%d)"
          git push

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
